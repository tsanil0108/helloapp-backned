server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: packers-movers-lead-marketplace

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:helloDB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Anil108}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public

    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  cache:
    type: simple

  # =====================================================
  # GMAIL SMTP
  # =====================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: developer00108@gmail.com
    password: wzqx ixbq nfsx smbk

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


# =========================================================
# SPRINGDOC / SWAGGER
# =========================================================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true


# =========================================================
# APPLICATION CONFIGURATION
# =========================================================

app:

  # =====================================================
  # CAPTCHA
  # =====================================================

  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
    secret: ${CAPTCHA_SECRET:}
    verify-url: ${CAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}


  # =====================================================
  # JWT
  # =====================================================

  jwt:
    secret: ${JWT_SECRET:HelloPackersDevSecret2026ChangeThisToSomethingLongAndRandom123!}

    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:3600000}

    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:1209600000}

    issuer: packers-movers-marketplace


  # =====================================================
  # CORS
  # =====================================================

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}


  # =====================================================
  # MARKETPLACE
  # =====================================================

  marketplace:
    default-max-providers-per-lead: 3
    lead-offer-expiry-hours: 24
    default-lead-unlock-fee: 199.00
    duplicate-lead-window-hours: 72
    rate-limit-per-mobile-per-day: 3


  # =====================================================
  # RAZORPAY
  # =====================================================

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}


  # =====================================================
  # PASSWORD RESET
  # =====================================================

  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}

    mail-from: ${PASSWORD_RESET_MAIL_FROM:developer00108@gmail.com}


  # =====================================================
  # NOTIFICATIONS
  # =====================================================

  notifications:
    firebase-enabled: ${FIREBASE_ENABLED:false}

    sms-enabled: ${SMS_ENABLED:false}

    whatsapp-enabled: ${WHATSAPP_ENABLED:false}

    email-enabled: true


# =========================================================
# ACTUATOR
# =========================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true


# =========================================================
# LOGGING
# =========================================================

logging:
  level:
    root: INFO

    com.packersmovers.marketplace: INFO

    org.hibernate.SQL: WARN